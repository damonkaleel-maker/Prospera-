name: Android APK - Próspera +
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        run: |
          java --version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK with diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug 2>&1 | tee build.log

      - name: Verify APK exists and is non-empty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: prospera-mais-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospera-mais-build-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 7

  cleanup-failed-runs:
    name: Delete previous failed build runs after successful APK build
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed runs for this APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/workflows/android-apk.yml/runs?status=failure&per_page=100" --jq '.workflow_runs[].id' |
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Deleting failed workflow run $run_id"
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"
          done
