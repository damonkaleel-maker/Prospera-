name: Android APK - Próspera +
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        run: |
          java --version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK with diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug 2>&1 | tee build.log

      - name: Verify APK exists and is non-empty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: prospera-mais-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  cleanup-previous-runs:
    name: Best-effort cleanup of previous workflow runs
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Delete earlier runs when GitHub permits it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -u
          if ! gh api --paginate "repos/$GH_REPO/actions/workflows/android-apk.yml/runs?per_page=100" --jq '.workflow_runs[].id' > runs-to-clean.txt; then
            echo "::warning::APK built successfully, but previous runs could not be listed for cleanup."
            exit 0
          fi
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
            echo "Attempting to delete earlier workflow run $run_id"
            if ! gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"; then
              echo "::warning::GitHub denied deletion of run $run_id. APK build remains successful; cleanup requires an authorized token or repository setting."
            fi
          done < runs-to-clean.txt
